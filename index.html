</head>
<body>
    <div class="banner">

        <div class="links">

                <a href="https://github.com/scattercat-123" target="_blank"rel="noopener noreferrer">
                    <i class="fa-brands fa-github"></i>
                </a>
            </div>
            <div class="discord">
                <a href="https://www.youtube.com/@magicsmoke3am" target="_blank"rel="noopener noreferrer">
                    <i class="fa-brands fa-discord"></i>
                </a>
            </div>
            <div class="youtube">
                <a href="https://discord.com/users/920979530762551297" target="_blank"rel="noopener noreferrer">

            <div class="steam">

    <div class = "about-me">
        <h2>
            <span class="dot"></span>
            <svg class="play" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4 L20 12 L6 20 Z"/></svg></span>
            <span class="cat">cat </span>
            <span class="md">about-me.md</span>

    <div class="footer">

        <p>Source code: <a href="https://github.com/scattercat-123/Personal-Site">https://github.com/scattercat-123/Personal-Site</a></p>

    </div>
    
    <script>
        document.addEventListener('contextmenu', function(event) {
            event.preventDefault();
        });
        fetch('about-me.md')
            .then(res => res.text())
            .then(md => {
            document.getElementById('about-output').innerHTML = marked.parse(md);
            })
            .catch(() => {
            document.getElementById('about-output').textContent = 'cat: about-me.md: No such file';
            });
    </script>
